[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mafundipro-backend"
version = "0.1.0"
description = "Secure backend for the MafundiPro marketplace"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120,<1.0",
    "uvicorn[standard]>=0.38,<1.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.11,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.17,<2.0",
    "argon2-cffi>=25.1,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10.0",
    "pytest-asyncio>=1.2,<2.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.14,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
